name: AI English Preview
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering and voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          python -m pip install -r requirements.txt
      - name: Download open voice model
        run: |
          mkdir -p voices
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
          curl -fL --retry 3 "$base/kokoro-v1.0.onnx" -o voices/kokoro-v1.0.onnx
          curl -fL --retry 3 "$base/voices-v1.0.bin" -o voices/voices-v1.0.bin
      - name: Build preview
        run: python scripts/make_short.py
      - name: Save reviewable MP4
        uses: actions/upload-artifact@v4
        with:
          name: english-animated-preview
          path: output/
          retention-days: 7

name: Mind-il AI English Short
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *' # 16:00 IST
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Download English voice
        run: |
          mkdir -p voices
          base=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium
          curl -fL --retry 3 "$base/en_US-lessac-medium.onnx" -o voices/en_US-lessac-medium.onnx
          curl -fL --retry 3 "$base/en_US-lessac-medium.onnx.json" -o voices/en_US-lessac-medium.onnx.json
      - name: Build preview
        run: python scripts/make_short.py
      - name: Save reviewable MP4
        uses: actions/upload-artifact@v4
        with:
          name: mind-il-ai-english-preview
          path: output/
          retention-days: 7

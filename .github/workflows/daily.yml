name: The AI Side — motion preview
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rendering and voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
          python -m pip install -r requirements.txt
          cd motion
          npm install
      - name: Download open voice model
        run: |
          mkdir -p voices
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
          curl -fL --retry 3 "$base/kokoro-v1.0.onnx" -o voices/kokoro-v1.0.onnx
          curl -fL --retry 3 "$base/voices-v1.0.bin" -o voices/voices-v1.0.bin
      - name: Create voice and timing
        run: python motion/voice.py
      - name: Render animated short
        run: |
          mkdir -p output
          cd motion
          npx remotion render src/index.jsx TheAISide ../output/short.mp4 --concurrency=2
      - name: Save reviewable MP4
        uses: actions/upload-artifact@v4
        with:
          name: ai-side-motion-preview
          path: output/
          retention-days: 7

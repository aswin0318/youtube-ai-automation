name: Harness redesign — video preview
on:
  pull_request:
    paths:
      - 'motion/src/harness-redesign.jsx'
      - '.github/workflows/harness-redesign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
          python -m pip install -r requirements.txt
          cd motion
          npm install
      - name: Download voice
        run: |
          mkdir -p voices
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
          curl -fL --retry 3 "$base/kokoro-v1.0.onnx" -o voices/kokoro-v1.0.onnx
          curl -fL --retry 3 "$base/voices-v1.0.bin" -o voices/voices-v1.0.bin
      - name: Generate narration and scene timings
        run: python motion/harness_voice.py
      - name: Render representative scene frames
        run: |
          mkdir -p output/layout-frames
          frames=$(python -c "import json; s=json.load(open('motion/src/harness-scenes.json')); print(' '.join(str(x['start']+x['duration']//2) for x in s))")
          cd motion
          for frame in $frames; do
            npx remotion still src/harness-redesign.jsx HarnessExplainer "../output/layout-frames/$(printf '%06d' "$frame").png" --frame="$frame"
          done
      - name: Create visual contact sheet
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          files=sorted(Path('output/layout-frames').glob('*.png'))
          assert len(files)>=14, f'Expected at least 14 frames, got {len(files)}'
          sheet=Image.new('RGB',(270*4,480*4),'#111111')
          for i,p in enumerate(files[:16]):
              img=Image.open(p).convert('RGB')
              img=ImageOps.contain(img,(270,480))
              sheet.paste(img,((i%4)*270,(i//4)*480))
          sheet.save('output/layout-contact.jpg',quality=90)
          PY
      - name: Render complete review video
        run: |
          cd motion
          npx remotion render src/harness-redesign.jsx HarnessExplainer ../output/agent-harness-redesigned.mp4 --concurrency=2
      - name: Verify output tracks and dimensions
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height,r_frame_rate -of json output/agent-harness-redesigned.mp4 > output/media-info.json
          python - <<'PY'
          import json
          d=json.load(open('output/media-info.json'))
          assert any(s['codec_type']=='audio' for s in d['streams'])
          assert any(s['codec_type']=='video' and s.get('width')==1080 and s.get('height')==1920 for s in d['streams'])
          assert 30<float(d['format']['duration'])<180
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: harness-redesigned-review
          path: |
            output/agent-harness-redesigned.mp4
            output/media-info.json
            output/layout-contact.jpg
          retention-days: 7

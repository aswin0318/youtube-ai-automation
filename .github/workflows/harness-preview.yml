name: Agent harness — review video
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'motion/harness_voice.py'
      - 'motion/src/harness.jsx'
      - 'motion/src/harness-scenes.json'
      - '.github/workflows/harness-preview.yml'
permissions:
  contents: read
concurrency:
  group: harness-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
          python -m pip install -r requirements.txt
          cd motion
          npm install
      - name: Download open voice model
        run: |
          mkdir -p voices
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
          curl -fL --retry 3 "$base/kokoro-v1.0.onnx" -o voices/kokoro-v1.0.onnx
          curl -fL --retry 3 "$base/voices-v1.0.bin" -o voices/voices-v1.0.bin
      - name: Generate approved narration and timing
        run: python motion/harness_voice.py
      - name: Render review video
        run: |
          mkdir -p output/harness-review
          cd motion
          npx remotion render src/harness.jsx HarnessExplainer ../output/harness-review/agent-harness.mp4 --concurrency=2
          cp src/harness-scenes.json ../output/harness-review/timing.json
      - name: Verify media streams
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height,r_frame_rate -of json output/harness-review/agent-harness.mp4 > output/harness-review/media-info.json
          python - <<'PY'
          import json
          info=json.load(open('output/harness-review/media-info.json'))
          streams=info['streams']
          assert any(s['codec_type']=='video' and s.get('width')==1080 and s.get('height')==1920 for s in streams)
          assert any(s['codec_type']=='audio' for s in streams)
          assert float(info['format']['duration'])>30
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: agent-harness-review
          path: output/harness-review/
          retention-days: 7
